name: ci

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Add SHORT_SHA env property with commit short sha
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: wortiz/python-app:${{ env.SHORT_SHA }}
    outputs:
      commit_id: ${{ env.SHORT_SHA }}

  cd:
    runs-on: self-hosted
    needs: [ci]
    steps:
      - uses: actions/checkout@v3

      - name: Modify tags
        shell: bash
        run: |
          echo ${{needs.ci.outputs.commit_id}}
          sed -i "s/IMAGE_TAG/${{ needs.ci.outputs.commit_id }}/g" chart/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v10
        with:
          message: 'Update values.yaml with commit ${{needs.ci.outputs.commit_id}}'

      - name: Install Argocd
        shell: bash
        run: |
          curl -ksSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
         
      - name: Argocd Sync
        shell: bash
        run: | 
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGO_PASSWORD }}
          argocd app sync python-app

